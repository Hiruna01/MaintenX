name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only by default. Nothing here publishes, comments or writes to the repo, so the
# token does not need write access to anything.
permissions:
  contents: read

# A second push to the same branch cancels the first run rather than queueing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# NO SECRETS IN THIS FILE, and none are needed:
#   * the agent job runs in STUB_MODE, so it never calls an LLM provider and needs no key;
#   * the api job's database is a throwaway container that exists only for the length of
#     the job and is reachable only from it — its password is a fixed local-only value,
#     not a credential for anything real;
#   * nothing here deploys.
# If a job ever does need a real credential, it goes in GitHub repository secrets and is
# referenced as ${{ secrets.NAME }} — never pasted here.

jobs:
  # ---------------------------------------------------------------------------
  # ASP.NET Core API — build and run the xUnit suite against real PostgreSQL 16.
  # ---------------------------------------------------------------------------
  api:
    name: api (.NET 8 + PostgreSQL 16)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: maintenx_ci
        ports:
          - 5432:5432
        # Without a health check the steps below can start before the server accepts
        # connections, and the first test fails with a connection refused that looks
        # like a code problem.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # There is no .sln in this repo, so every step names the test project. It has a
      # ProjectReference to api/, so restoring and building it covers both.
      - name: Restore
        run: dotnet restore api.Tests/api.Tests.csproj

      - name: Build
        run: dotnet build api.Tests/api.Tests.csproj --configuration Release --no-restore

      - name: Test against PostgreSQL with migrations applied
        # ApiFactory sees TEST_DATABASE_URL and switches from SQLite to this server: it
        # creates a uniquely named database per test class, runs db.Database.Migrate() on
        # it, and drops it afterwards. That is what makes this job exercise the real
        # migrations, real jsonb columns and real constraints rather than a model-built
        # schema. Npgsql key/value form, not a postgres:// URL.
        env:
          TEST_DATABASE_URL: Host=localhost;Port=5432;Database=maintenx_ci;Username=postgres;Password=postgres
        run: dotnet test api.Tests/api.Tests.csproj --configuration Release --no-build --verbosity normal

  # ---------------------------------------------------------------------------
  # Python agent service — pytest in stub mode, so no provider key and no network.
  # ---------------------------------------------------------------------------
  agent:
    name: agent (pytest, STUB_MODE)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: agent

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        # STUB_MODE makes the LLM client return fixed valid JSON with no network call.
        # The suite additionally blocks sockets in an autouse fixture, so this job cannot
        # reach a provider even if something tried to.
        env:
          STUB_MODE: '1'
        run: pytest -q

  # ---------------------------------------------------------------------------
  # React web client — a production build must succeed.
  # ---------------------------------------------------------------------------
  web:
    name: web (Vite build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Vite 8 requires Node ^20.19 || >=22.12; 22 is the current LTS.
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # ci, not install: it installs exactly what package-lock.json pins and fails if the
      # lock file and package.json disagree.
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Flutter mobile client — static analysis.
  # ---------------------------------------------------------------------------
  mobile:
    name: mobile (flutter analyze)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # analyze resolves imports, so the packages have to be there first.
      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze
