name: maintenx_mobile
description: MaintenX campus facilities maintenance — Flutter client.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter

  # State management. Providers only — no codegen, no build_runner.
  flutter_riverpod: ^2.5.1

  # Declarative routing with a redirect guard.
  go_router: ^14.2.0

  # The JWT is stored here, NOT in SharedPreferences: this is Keychain on iOS and
  # EncryptedSharedPreferences on Android, so the token is not readable as plain
  # text from the app sandbox or an adb backup.
  flutter_secure_storage: ^9.2.2

  http: ^1.2.2
  # MediaType for a multipart part's Content-Type. Already a dependency of `http`; listed
  # because the photo upload imports it directly.
  http_parser: ^4.1.2
  mobile_scanner: ^7.4.2

  # A report's photo, from the camera or the gallery.
  image_picker: ^1.2.3

  # The drawn asset sticker on the login screen — a real QR code of a seeded tag.
  qr_flutter: ^4.1.0

  # The web client's icon set (lucide-react), so an icon means the same thing on both.
  lucide_icons_flutter: ^3.1.20

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Hanken Grotesk, the web client's typeface, bundled as static TTFs (Flutter cannot read
  # the web's .woff2). Bundled rather than google_fonts, which downloads at runtime — a
  # test run must never touch the network. Licence: assets/fonts/OFL.txt.
  fonts:
    - family: HankenGrotesk
      fonts:
        - asset: assets/fonts/HankenGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/HankenGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/HankenGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/HankenGrotesk-Bold.ttf
          weight: 700
